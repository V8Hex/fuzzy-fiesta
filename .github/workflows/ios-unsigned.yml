name: Build unsigned iPhone IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'screenshots/**'

permissions:
  contents: read

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check app logic
        run: |
          npm run check
          npm test
      - name: Compile and package iPhone app
        run: bash scripts/build-ios-unsigned.sh
      - name: Save IPA
        uses: actions/upload-artifact@v4
        with:
          name: Fridgeful-unsigned-IPA
          path: build/Fridgeful-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Save build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iOS-build-log
          path: build/ios-build.log
          if-no-files-found: ignore
          retention-days: 7
